[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drukcommon"
version = "0.1.0"
description = "Shared service template for DrukRescue microservices: config, logging, tracing, metrics, DB, events, auth."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.54",  # OTel SQLAlchemy instrumentation supports < 2.1
  "psycopg[binary]==3.3.6",
  "pika==1.4.4",
  "httpx==0.28.1",
  "pyjwt==2.15.1",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-instrumentation-httpx==0.66b0",
  "opentelemetry-instrumentation-sqlalchemy==0.66b0",
]

[tool.setuptools.packages.find]
include = ["drukcommon*"]
