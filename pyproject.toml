# Repo-wide tool configuration (this is not an installable package).

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "B008",   # FastAPI's Depends(...) in argument defaults is the intended pattern
  "S104",   # binding to 0.0.0.0 is correct inside a container
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "E731"]
"**/conftest.py" = ["S101", "S105", "S106", "E402"]
"scripts/*.py" = ["S310"]  # urllib against our own gateway URL

[tool.ruff.lint.isort]
known-first-party = ["app", "drukcommon"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
