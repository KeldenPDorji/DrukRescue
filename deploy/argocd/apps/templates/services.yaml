{{- range .Values.services }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drukrescue-{{ . }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # after platform (1) and monitoring CRDs (0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: deploy/charts/{{ . }}
    helm:
      releaseName: {{ . }}
      valueFiles:
        - values.yaml
        - ../../envs/{{ $.Values.env }}/values.yaml
        - ../../envs/{{ $.Values.env }}/services/{{ . }}.yaml
      ignoreMissingValueFiles: true  # most services have no per-env override file
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.namespaces.app }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true  # manual kubectl changes are reverted to what Git says
    syncOptions:
      - CreateNamespace=true
{{- end }}
