# Rendered by the shared library chart (deploy/charts/drukrescue-lib). Env-specific overrides live in deploy/envs/.
name: gateway
image:
  tag: latest  # CI bumps this to the commit SHA (GitOps)
port: 8000
replicaCount: 1
database: { enabled: false }
rabbitmq: { enabled: false }
redis: { enabled: true }
jwt: { enabled: true }
networkPolicy:
  allowIngressController: true
  allowFrom: [frontend]
env:
  RATE_LIMIT_PER_MINUTE: "120"
  AUTH_RATE_LIMIT_PER_MINUTE: "10"
ingress:
  enabled: true
  paths: ["/api"]
