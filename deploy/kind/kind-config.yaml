# 3-node Kind cluster on one laptop (rescue.md section 8). Created by scripts/bootstrap-kind.sh.
# Ports 80/443 on the control-plane node are mapped to the host for ingress-nginx.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: drukrescue
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
  - role: worker
  - role: worker
